<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f5f0"><title>우리 아이 수유 기록</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{font-family:ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#252a30;background:#f8f5f0;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:26px 18px 52px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{font-weight:800;font-size:19px}.muted{color:#717980;font-size:13px}.panel{background:#fff;border:1px solid #ece8e2;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #32302a08}.title{font-size:16px;font-weight:750;margin:0 0 14px}.row{display:flex;gap:10px;align-items:end}.field{flex:1;min-width:0}label{display:block;font-size:12px;color:#626a70;margin-bottom:6px}input,select{width:100%;height:44px;border:1px solid #d9dfe2;border-radius:10px;padding:0 11px;background:white;font:inherit}button{border:0;border-radius:10px;background:#286b61;color:white;font:inherit;font-weight:700;padding:12px 15px;cursor:pointer}button.secondary{background:#edf3f1;color:#245c53}button.ghost{background:transparent;color:#58615f;padding:7px}.hidden{display:none!important}.stat{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #f0efec;font-size:14px}.stat:last-child{border:0}.feedrow{padding:11px 0;border-bottom:1px solid #f0efec;display:flex;justify-content:space-between;font-size:14px}.notice{background:#fff8dc;border-radius:10px;padding:12px;color:#6c571e;font-size:13px;line-height:1.5}.ok{color:#286b61}.error{color:#b33434;white-space:pre-wrap}.pill{font-size:12px;background:#edf3f1;color:#245c53;padding:5px 9px;border-radius:50px}.actions{display:flex;gap:8px}.small{font-size:12px}.auth{max-width:460px;margin:12vh auto}.wide{width:100%}@media(max-width:520px){.row{align-items:stretch;flex-wrap:wrap}.row .field{flex:1 1 42%}.row button{width:100%}.panel{padding:17px}}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div><div class="brand">🍼 우리 아이 수유 기록</div><div class="muted">아이별 수유와 분유 재고를 기록해요</div></div><button id="signout" class="ghost hidden">로그아웃</button></header>
  <section id="auth" class="panel auth"><h1 class="title">보호자 로그인</h1><p class="muted">이메일로 로그인 링크를 보내드려요.</p><div class="field"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div><button id="login" class="wide" style="margin-top:12px">로그인 링크 받기</button><p id="authmsg" class="muted"></p></section>
  <section id="app" class="hidden">
    <div class="panel"><div class="row"><div class="field"><label for="child">아이 선택</label><select id="child"></select></div><button class="secondary" id="addchild">아이 추가</button><button class="secondary" id="editchild">프로필 수정</button><button class="secondary" id="connecttg">텔레그램 연결</button></div></div>
    <div class="panel"><h2 class="title">수유 기록</h2><div class="row"><div class="field"><label for="amount">먹인 양 (ml)</label><input id="amount" type="number" min="1" max="1000" step="10" value="120"></div><div class="field"><label for="fedat">먹인 시각</label><input id="fedat" type="datetime-local"></div><button id="log">기록 저장</button></div><p id="feedmsg" class="muted"></p></div>
    <div class="panel"><h2 class="title">오늘의 참고 정보</h2><div id="stats"></div><div id="estimate" class="notice" style="margin-top:12px"></div></div>
    <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2 class="title" style="margin:0">분유 재고</h2><button class="secondary small" id="inventorybtn">재고 설정</button></div><div id="inventory" class="muted" style="margin-top:12px"></div></div>
    <div class="panel"><h2 class="title">최근 수유</h2><div id="history" class="muted">기록이 없습니다.</div></div>
    <p class="muted small">표시되는 섭취량과 시간은 참고 추정치입니다. 아기의 배고픔 신호와 소아과 의료진의 지침을 우선해 주세요.</p>
  </section>
  <p id="globalmsg" class="error"></p>
</main>
<script src="config.js"></script>
<script>
  // Replace with your Supabase project's URL and public anon key. Never put a service-role key here.
  const SUPABASE_URL = window.APP_CONFIG?.SUPABASE_URL;
  const SUPABASE_ANON_KEY = window.APP_CONFIG?.SUPABASE_ANON_KEY;
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY || SUPABASE_URL.includes('YOUR_') || SUPABASE_ANON_KEY.includes('YOUR_')) {
    document.getElementById('authmsg').textContent = '설정이 필요합니다. config.example.js를 config.js로 복사하고 Supabase 공개 연결 정보를 입력하세요.';
    document.getElementById('login').disabled = true;
    throw new Error('Supabase configuration is missing');
  }
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = id => document.getElementById(id);
  let currentUser, children = [], selected;
  const localDateTime = d => { const off=d.getTimezoneOffset()*60000; return new Date(d.getTime()-off).toISOString().slice(0,16); };
  $('fedat').value = localDateTime(new Date());
  $('login').onclick = async () => { const {error}=await client.auth.signInWithOtp({email:$('email').value,options:{emailRedirectTo:location.origin+location.pathname}}); $('authmsg').textContent=error?.message||'로그인 링크를 이메일로 보냈어요.'; };
  $('signout').onclick = async () => client.auth.signOut();
  client.auth.onAuthStateChange((_event,session)=>{ currentUser=session?.user||null; renderAuth(); if(currentUser) load(); });
  async function renderAuth(){ $('auth').classList.toggle('hidden',!!currentUser); $('app').classList.toggle('hidden',!currentUser); $('signout').classList.toggle('hidden',!currentUser); }
  $('addchild').onclick=async()=>{const name=prompt('아이 이름');if(!name)return;const dob=prompt('생년월일 (YYYY-MM-DD)');if(!dob)return;const kg=prompt('최근 체중(kg), 모르면 비워두세요');const feeds=Number(prompt('하루 목표 수유 횟수 (기본 8)', '8'))||8;const interval=Number(prompt('알림 간격(분) (기본 180)', '180'))||180;const {error}=await client.from('children').insert({name,date_of_birth:dob,weight_kg:kg?Number(kg):null,feeds_per_day:feeds,feeding_interval_minutes:interval});if(error)showError(error.message);else await load();};
  $('connecttg').onclick=async()=>{if(!selected)return;const chat=prompt('Telegram에서 봇에 /start를 보낸 뒤 n8n 실행 기록에서 확인한 chat ID를 붙여 넣으세요.',selected.telegram_chat_id||'');if(chat===null)return;const {error}=await client.from('children').update({telegram_chat_id:chat.trim()||null}).eq('id',selected.id);if(error)showError(error.message);else await load();};
  $('editchild').onclick=async()=>{if(!selected)return;const dob=prompt('생년월일 (YYYY-MM-DD)',selected.date_of_birth);if(!dob)return;const kg=prompt('최근 체중 (kg), 모르면 비워두세요',selected.weight_kg??'');const feeds=Number(prompt('하루 목표 수유 횟수',String(selected.feeds_per_day)))||selected.feeds_per_day;const interval=Number(prompt('알림 간격 (분)',String(selected.feeding_interval_minutes)))||selected.feeding_interval_minutes;const {error}=await client.from('children').update({date_of_birth:dob,weight_kg:kg?Number(kg):null,feeds_per_day:feeds,feeding_interval_minutes:interval}).eq('id',selected.id);if(error)showError(error.message);else await load();};
  $('child').onchange=()=>{selected=children.find(c=>c.id===$('child').value);refresh();};
  $('log').onclick=async()=>{if(!selected)return;const amount=Number($('amount').value),fedAt=new Date($('fedat').value);const {error}=await client.rpc('log_feeding',{p_child_id:selected.id,p_amount_ml:amount,p_fed_at:fedAt.toISOString()});if(error){$('feedmsg').textContent=error.message;return;} $('feedmsg').textContent=`${selected.name}에게 ${amount}ml 먹인 기록을 저장했어요.`;$('fedat').value=localDateTime(new Date());await refresh();};
  $('inventorybtn').onclick=async()=>{if(!selected)return;const {data}=await client.from('formula_inventory').select('*').eq('child_id',selected.id).maybeSingle();const product=prompt('분유 제품명',data?.product_name||'');if(!product)return;const stock=Number(prompt('현재 남은 분유량 (조제 후 환산 ml)',String(data?.stock_ml_equivalent??0)));const threshold=Number(prompt('재주문 기준 (ml)',String(data?.reorder_threshold_ml??1500)));const yieldMl=Number(prompt('한 통의 조제 환산량 (ml)',String(data?.package_yield_ml??8000)));const lead=Number(prompt('배송 여유일',String(data?.delivery_lead_days??3)));const row={owner_id:currentUser.id,child_id:selected.id,product_name:product,stock_ml_equivalent:stock,reorder_threshold_ml:threshold,package_yield_ml:yieldMl,delivery_lead_days:lead,updated_at:new Date().toISOString()};const {error}=await client.from('formula_inventory').upsert(row,{onConflict:'child_id'});if(error)showError(error.message);else refresh();};
  async function load(){const {data,error}=await client.from('children').select('*').eq('active',true).order('created_at');if(error){showError(error.message);return;}children=data||[];$('child').innerHTML=children.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')||'<option value="">아이를 추가해 주세요</option>';selected=children[0];if(selected)$('child').value=selected.id;await refresh();}
  async function refresh(){if(!selected)return;$('globalmsg').textContent='';const today=new Date();today.setHours(0,0,0,0);const [{data:feeds,error},{data:lastFeed,error:lastError}]=await Promise.all([client.from('feedings').select('amount_ml,fed_at').eq('child_id',selected.id).gte('fed_at',today.toISOString()).order('fed_at',{ascending:false}),client.from('feedings').select('amount_ml,fed_at').eq('child_id',selected.id).order('fed_at',{ascending:false}).limit(1)]);if(error||lastError){showError((error||lastError).message);return;}const list=feeds||[];const latest=lastFeed?.[0];const next=latest?new Date(new Date(latest.fed_at).getTime()+selected.feeding_interval_minutes*60000):null;const ageDays=Math.floor((Date.now()-new Date(selected.date_of_birth+'T00:00:00').getTime())/86400000);const month=Math.floor(ageDays/30.4375);const daily=selected.weight_kg?selected.weight_kg*150:null;const perFeed=daily?Math.round(daily/selected.feeds_per_day):null;const upper=selected.weight_kg?selected.weight_kg*200:null;
    $('stats').innerHTML=`<div class="stat"><span>월령</span><b>${Math.max(0,month)}개월</b></div><div class="stat"><span>오늘 먹인 양</span><b>${list.reduce((s,x)=>s+x.amount_ml,0)}ml · ${list.length}회</b></div><div class="stat"><span>다음 알림 기준</span><b>${next?next.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'수유 기록 후 계산'}</b></div>`;
    $('estimate').innerHTML=ageDays<7?'생후 첫 주에는 일반 체중 기반 계산을 사용하지 않습니다. 의료진이 안내한 수유 지침을 따르세요.':ageDays>=183?'생후 6개월 이후에는 이유식 등으로 섭취량이 달라질 수 있어 이 화면에서 분유량을 추정하지 않습니다. 의료진의 지침을 따르세요.':perFeed?`체중 ${selected.weight_kg}kg 기준 하루 참고량은 약 ${Math.round(daily)}ml (150–200ml/kg이면 ${Math.round(daily)}–${Math.round(upper)}ml)입니다. ${selected.feeds_per_day}회 기준 1회 중심 추정치는 약 ${perFeed}ml예요. 실제 필요량은 성장과 아기 상태에 따라 달라요.${daily>=960?'<br><b>하루 중심 추정치가 약 960ml 이상입니다. 소아과에 확인해 주세요.</b>':''}`:'체중을 입력하면 체중 기준 참고량을 표시합니다. 이 값은 참고용이며 소아과 지침이 우선입니다.';
    $('history').innerHTML=list.length?list.slice(0,10).map(x=>`<div class="feedrow"><span>${new Date(x.fed_at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span><b>${x.amount_ml}ml</b></div>`).join():'오늘 수유 기록이 없습니다.';
    const {data:inv}=await client.from('formula_inventory').select('*').eq('child_id',selected.id).maybeSingle();$('inventory').innerHTML=inv?`<div class="stat"><span>${escapeHtml(inv.product_name)}</span><b>${inv.stock_ml_equivalent.toLocaleString()}ml</b></div><div class="muted small">재주문 기준 ${inv.reorder_threshold_ml.toLocaleString()}ml · 한 통 환산 ${inv.package_yield_ml.toLocaleString()}ml</div>`:'제품과 재고를 설정하면 구매 시점을 알려드려요.';
  }
  function showError(m){$('globalmsg').textContent=m;}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  renderAuth();
</script></body></html>
